<div class="container fade-in">
  <h2 class="mb-4">Provider Management</h2>

  <div class="row">
    <!-- List of Providers -->
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Medical Staff Directory</h5>
          <!-- Search Bar -->
          <input type="text" 
                 class="form-control form-control-sm w-50" 
                 placeholder="Search by name or specialty..." 
                 [(ngModel)]="searchText" 
                 (input)="filterProviders()">
        </div>
        <div class="card-body p-0">
          <table class="table table-striped table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Specialty</th>
                <th>Address</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <!-- Use filteredProviders instead of providers -->
              <tr *ngFor="let p of filteredProviders">
                <td>{{ p.providerID }}</td>
                <td>{{ p.firstName }} {{ p.lastName }}</td>
                <td><span class="badge bg-info text-dark">{{ p.specialty }}</span></td>
                <td>{{ p.addrss }}</td>
                <td>
                  <!-- Edit Button -->
                  <button class="btn btn-sm btn-outline-warning me-2" (click)="editProvider(p)">
                    Edit
                  </button>
                  <!-- Delete Button -->
                  <button class="btn btn-sm btn-outline-danger" (click)="deleteProvider(p.providerID)">
                    Delete
                  </button>
                </td>
              </tr>
              <tr *ngIf="filteredProviders.length === 0">
                <td colspan="5" class="text-center text-muted py-4">No matching providers found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Add/Edit Form -->
    <div class="col-md-4">
      <div class="card shadow-sm">
        <!-- Dynamic Header Color -->
        <div class="card-header text-white" 
             [ngClass]="currentProvider.providerID === 0 ? 'bg-primary' : 'bg-warning'">
          <h5 class="mb-0">
            {{ currentProvider.providerID === 0 ? 'Add New Provider' : 'Edit Provider' }}
          </h5>
        </div>
        <div class="card-body">
          <form (ngSubmit)="saveProvider()">
            <div class="mb-3">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control" [(ngModel)]="currentProvider.firstName" name="firstName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control" [(ngModel)]="currentProvider.lastName" name="lastName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Specialty</label>
              <input type="text" class="form-control" [(ngModel)]="currentProvider.specialty" name="specialty">
            </div>
            <div class="mb-3">
              <label class="form-label">Address</label>
              <input type="text" class="form-control" [(ngModel)]="currentProvider.addrss" name="addrss">
            </div>
            
            <button type="submit" class="btn w-100 mb-2"
                    [ngClass]="currentProvider.providerID === 0 ? 'btn-primary' : 'btn-warning'">
              {{ currentProvider.providerID === 0 ? 'Save Provider' : 'Update Changes' }}
            </button>

            <!-- Cancel Button (Only show when editing) -->
            <button *ngIf="currentProvider.providerID !== 0" 
                    type="button" 
                    class="btn btn-secondary w-100" 
                    (click)="resetForm()">
              Cancel Edit
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<p>dashboard works!</p>
<div class="container fade-in">
  <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Clinic Dashboard</h1>
  </div>

  <!-- Quick Stats Row -->
  <div class="row mb-4">
    <div class="col-md-4">
      <div class="card text-white bg-primary mb-3">
        <div class="card-header">Total Providers</div>
        <div class="card-body">
          <h2 class="card-title">{{ totalProviders }}</h2>
          <p class="card-text">Active doctors on staff.</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-white bg-success mb-3">
        <div class="card-header">Total Revenue</div>
        <div class="card-body">
          <h2 class="card-title">{{ totalRevenue | currency }}</h2>
          <p class="card-text">Total billed to date.</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-white bg-info mb-3">
        <div class="card-header">Services Offered</div>
        <div class="card-body">
          <h2 class="card-title">{{ totalServices }}</h2>
          <p class="card-text">Unique CPT codes available.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Trend Analysis Chart -->
  <div class="card">
    <div class="card-header">
      <i class="bi bi-graph-up"></i> Revenue Trends (Phase 2 Analysis)
    </div>
    <div class="card-body">
      <div style="display: block;">
        <canvas baseChart width="400" height="150"
                [data]="lineChartData"
                [options]="lineChartOptions"
                [type]="'line'">
        </canvas>
      </div>
    </div>
  </div>
</div>

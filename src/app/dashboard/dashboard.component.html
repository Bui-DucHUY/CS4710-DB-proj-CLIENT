<div class="container fade-in">
  <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Clinic Dashboard</h1>
  </div>

  <!-- Stats Cards -->
  <div class="row mb-4">
    <div class="col-md-4">
      <div class="card text-white bg-primary mb-3 h-100">
        <div class="card-header">Total Providers</div>
        <div class="card-body">
          <h2 class="card-title display-4">{{ totalProviders }}</h2>
          <p class="card-text">Active medical staff.</p>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card text-white bg-success mb-3 h-100">
        <div class="card-header">Total Revenue</div>
        <div class="card-body">
          <h2 class="card-title display-4">{{ totalRevenue | currency }}</h2>
          <p class="card-text">Total billed amount (2024).</p>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card text-white bg-info mb-3 h-100">
        <div class="card-header">Services Offered</div>
        <div class="card-body">
          <h2 class="card-title display-4">{{ totalServices }}</h2>
          <p class="card-text">CPT codes available.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Chart Section -->
  <div class="card shadow-sm">
    <div class="card-header bg-white">
      <h5 class="mb-0">Revenue Trends (2024)</h5>
    </div>
    <div class="card-body">
      <!-- Fixed Height Container -->
      <div style="height: 300px; display: block;">
        <canvas baseChart
          [data]="lineChartData"
          [options]="lineChartOptions"
          [type]="'line'">
        </canvas>
      </div>
    </div>
  </div>
</div>
